[package]
name = "wgpu-deps-native"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Feature unification helper crate for the native platforms"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true
readme = "README.md"

# Override the workspace's `rust-version` key. Firefox uses `cargo vendor` to
# copy the crates it actually uses out of the workspace, so it's meaningful for
# them to have less restrictive MSRVs individually than the workspace as a
# whole, if their code permits. See `../README.md` for details.
rust-version = "1.76"

[features]
gles = ["wgpu-core/gles"]
vulkan = ["wgpu-core/vulkan"]
dx12 = ["wgpu-core/dx12"]
renderdoc = ["wgpu-core/renderdoc"]

# Depend on wgpu-core conditionally, so that the above features only apply to wgpu-core on this set of platforms.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu-core.workspace = true
